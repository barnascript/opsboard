# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Three services, each deployed on its own; buildFilter means a change to one
# remote redeploys only that remote, never the shell.
services:
  - type: web
    runtime: static
    name: opsboard-sales
    buildCommand: npm ci && npm run build -w @opsboard/sales
    staticPublishPath: apps/sales/dist
    buildFilter:
      paths: ["apps/sales/**", "packages/**", "package-lock.json"]
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /mf-manifest.json
        name: Cache-Control
        value: no-cache
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: CYPRESS_INSTALL_BINARY
        value: "0"
      - key: NODE_VERSION
        value: "22"

  - type: web
    runtime: static
    name: opsboard-customers
    buildCommand: npm ci && npm run build -w @opsboard/customers
    staticPublishPath: apps/customers/dist
    buildFilter:
      paths: ["apps/customers/**", "packages/**", "package-lock.json"]
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /mf-manifest.json
        name: Cache-Control
        value: no-cache
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: CYPRESS_INSTALL_BINARY
        value: "0"
      - key: NODE_VERSION
        value: "22"

  - type: web
    runtime: node
    name: opsboard
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build -w @opsboard/shell
    startCommand: npm run start -w @opsboard/shell
    healthCheckPath: /api/sales?days=7
    buildFilter:
      paths: ["apps/shell/**", "packages/**", "package-lock.json", "render.yaml"]
    envVars:
      - key: CYPRESS_INSTALL_BINARY
        value: "0"
      - key: NODE_VERSION
        value: "22"
      # Public URLs, set explicitly: fromService "host" resolves to Render's
      # internal private-network hostname, which a browser cannot reach.
      # NEXT_PUBLIC_* is inlined at build time, so changing these rebuilds the shell.
      - key: NEXT_PUBLIC_SALES_URL
        value: https://opsboard-sales.onrender.com
      - key: NEXT_PUBLIC_CUSTOMERS_URL
        value: https://opsboard-customers.onrender.com
